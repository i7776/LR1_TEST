{% block content %}
<div class="movie-card">
    <h2>📝 Регистрация нового зрителя</h2>

    {% if error %}
    <p style="color: red; font-weight: bold;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" ... >Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
