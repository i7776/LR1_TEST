{% extends 'movies/base.html' %}
{% block content %}
<div class="movie-card" >
    <h1>⚠️ Удаление фильма</h1>
    <p>Вы действительно хотите удалить фильм <strong>"{{ movie.title }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">
            ДА, УДАЛИТЬ НАВСЕГДА
        </button>
        <a href="/" >Нет, оставить</a>
    </form>
</div>
{% endblock %}
